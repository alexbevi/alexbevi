name: Metrics

on:
  # Daily at 05:17 UTC; displayed dates use America/Toronto below.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    permissions:
      contents: write

    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@latest
        with:
          user: alexbevi
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg

          # Stop before publishing if a plugin fails.
          plugins_errors_fatal: "yes"
          retries: 2
          retries_delay: 30

          # A shorter card with an explicit visual hierarchy.
          template: classic
          base: header, repositories, metadata
          config_timezone: America/Toronto
          config_display: regular
          config_animations: "no"
          config_order: base.header, base.repositories, isocalendar, languages

          plugin_isocalendar: "yes"
          plugin_isocalendar_duration: half-year

          # Repository language composition from GitHub's API.
          # This does not measure personal coding time or authored lines.
          plugin_languages: "yes"
          plugin_languages_indepth: "no"
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
          plugin_languages_threshold: "2%"
          plugin_languages_other: "yes"
          plugin_languages_colors: github
          plugin_languages_details: percentage

          # Keep the main card focused. Habits currently renders an error.
          plugin_habits: "no"
          plugin_achievements: "no"
          plugin_gists: "no"
          plugin_people: "no"
          plugin_topics: "no"
          plugin_stargazers: "no"

          # A restrained green accent that adapts to the viewer's theme.
          extras_css: |
            h1 {
              font-size: 24px;
              letter-spacing: -0.5px;
            }
            h2 {
              font-size: 15px;
              color: #238636;
            }
            @media (prefers-color-scheme: dark) {
              h2 { color: #3fb950; }
            }
